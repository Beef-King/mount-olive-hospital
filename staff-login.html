<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login — Mount Olive Hospital</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo">
      <svg class="mark" viewBox="0 0 40 40" fill="none">
        <circle cx="20" cy="20" r="19" fill="#0D4F4A"/>
        <path d="M20 10v20M10 20h20" stroke="#E8A233" stroke-width="4" stroke-linecap="round"/>
      </svg>
      Mount Olive Hospital
    </a>
    <a href="index.html" class="staff-link">← Back to site</a>
  </div>
</header>

<div class="login-shell">
  <div class="form-wrap" style="max-width:420px;">
    <div class="text-center" style="margin-bottom:24px;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#0D4F4A" stroke-width="1.8" style="margin:0 auto 12px;"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <h2>Staff Login</h2>
      <p style="color:#4B5F5C; font-size:0.9rem; margin-top:6px;">Access the appointments dashboard</p>
    </div>

    <div class="form-note">Demo only: any Staff ID and password will log you in — there's no real authentication yet.</div>

    <form id="staff-login-form" novalidate>
      <div class="form-row">
        <label for="staff-id">Staff ID</label>
        <input type="text" id="staff-id" required placeholder="e.g. MO-0231">
      </div>
      <div class="form-row">
        <label for="staff-password">Password</label>
        <input type="password" id="staff-password" required placeholder="••••••••">
      </div>
      <div id="login-error" style="display:none; color:#B4432E; font-size:0.85rem; margin-bottom:16px;">Please enter both fields.</div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none; padding-top:0;">
      <span>© <span id="year"></span> Mount Olive Hospital &amp; Maternity. All rights reserved.</span>
      <span>Demo site — for review purposes</span>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
